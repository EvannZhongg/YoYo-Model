dataset:
  image_input_dir: "dataset/Positive_Sample/1A"
  annotation_output_dir: "annotations"
  recursive: true
  keep_source_images: true
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".webp"

yolo:
  model_name: "yolo11n.pt"
  models_dir: "models"
  # Used by cli.models.download_yolo. Override with --url if Ultralytics changes asset URLs.
  model_url_template: "https://github.com/ultralytics/assets/releases/download/v8.4.0/{model_name}"

semantic_string:
  # Single-class MobileNetV3-FPN model for thin strings.
  dataset_dir: "datasets/1Ayoyo_dataset/string_segmentation"
  project: "runs/v2v3"
  run_name: "yoyo_v2v3_semantic_string"
  epochs: 12
  input_width: 960
  input_height: 544
  batch: 2
  workers: 0
  learning_rate: 0.001
  base_channels: 16
  min_mask_width_px: 1
  architecture: "mobilenet_v3_fpn"
  pretrained_backbone: true
  freeze_backbone_epochs: 3
  backbone_lr_multiplier: 0.05
  hard_negative_weight: 0.2
  negative_sample_weight: 4.0
  early_stopping_patience: 0
  early_stopping_min_epochs: 10
  seed: 20260830
  device: "cuda"

tracking:
  weights_path: "runs/experiments/det_replay_soup_a25/weights/best.pt"
  output_dir: "tracked_videos"
  confidence: 0.15
  iou: 0.7
  imgsz: 1024
  device: ""
  trace_length: 30
  line_thickness: 2
  text_scale: 0.6
  # Keep model inference and metadata at source resolution while limiting the
  # annotated preview video to a practical review size. Set to 0 for source.
  visualization_max_width: 1920
  pose_weights_path: "models/rtmpose/rtmpose-m-wholebody-256x192.onnx"
  pose_detector_path: "models/rtmpose/yolox_m_8xb8-300e_humanart-c2c7a14a.onnx"
  # WholeBody pose is optional review metadata.
  enable_pose: false
  # High-resolution MobileNetV3-FPN semantic string model.
  string_weights_path: "runs/experiments/semantic_ablation_nomorph_foundation_r1/weights/best.pt"
  enable_string_model: true
  # Semantic checkpoints use max(checkpoint validation threshold, this floor).
  string_confidence: 0.40
  string_inference_scale: 1.0
  # Reacquire the multi-segment centerline on every frame.
  string_inference_fps: 0.0
  # Add a color/Hough centerline only when the semantic probability map also
  # supports it. This recovers weak, fragmented string pixels without allowing
  # unrelated saturated stage lines into the final geometry.
  string_color_probability_augment: true
  # Search low-saturation local bright ridges after the saturated-color proposal.
  string_bright_line_augment: true
  # Bright ridges are less color-specific, so use a strict semantic mean gate.
  string_bright_line_min_mean: 0.70
  # Restrict Hough candidates to a dilated p>=0.10 semantic neighborhood.
  # This removes unrelated stage lines before the expensive Hough search.
  string_color_semantic_prefilter: true
  string_color_probability_min_mean: 0.70
  string_color_probability_min_fraction: 0.50
  # Temporal string tracking is review-only: stop propagation after a short
  # gap and reject optical-flow drift with forward/backward consistency.
  string_max_propagation_frames: 12
  string_flow_fb_max_error: 4.0
  # Competition division metadata used for hand-anchor annotation.
  yoyo_division: "1A"
  # Orientation classifier weights; runtime accepts the three- or four-class variant.
  orientation_weights_path: "runs/candidates/yoyo_unified_2b0cfca8743a_orientation_roi_9cd9d9361ab5_best_yoyo-only-final-warm-freeze10-lr1e4-v1/weights/best.pt"
  enable_orientation_model: true
  orientation_imgsz: 320
  # Stable cadence is 5 FPS. Ambiguous observations temporarily burst to 25 FPS.
  orientation_inference_fps: 5.0
  orientation_adaptive_inference: true
  orientation_burst_inference_fps: 25.0
  # Lower-confidence observations stay in the burst cadence.
  orientation_adaptive_min_confidence: 0.4
  orientation_adaptive_stable_observations: 4
  orientation_temporal_filter: true
  orientation_ema_alpha: 0.5
  orientation_switch_margin: 0.05
  orientation_switch_confirmations: 4
  orientation_strong_switch_confidence: 0.9
  orientation_strong_switch_margin: 0.1
  # Set positive values to enable continuous-time hysteresis/EMA in experiments.
  orientation_switch_confirmation_seconds: 0.0
  orientation_ema_time_constant_seconds: 0.0
