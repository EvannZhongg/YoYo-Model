model:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: "API_KEY"
  default_model: "qwen3.6-35b-a3b"
  available_models:
    - "qwen3.6-35b-a3b"
    - "qwen3.5-35b-a3b"
  min_image_tokens: "1024"
  max_image_tokens: "9800"
  max_response_tokens: 20000
  enable_thinking: true
  # oss: upload images to Alibaba Cloud OSS and send signed URLs to the model.
  # base64: send local images as data URLs directly, useful when OSS is not configured.
  image_transport: "base64"

oss:
  endpoint: ""
  region: ""
  bucket_name: ""
  object_prefix: "studio-temp/qwen-det"
  signed_url_expires_seconds: 3600

dataset:
  image_input_dir: "dataset/Positive_Sample/1A"
  # Current videos are exclusively 1A. Future groups remain schema-only.
  current_action_group: "1A"
  annotation_output_dir: "annotations"
  temp_output_dir: "tmp"
  recursive: true
  keep_source_images: true
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".webp"

yolo:
  model_name: "yolo11n.pt"
  models_dir: "models"
  # Used by download_yolo_model.py. Override with --url if Ultralytics changes asset URLs.
  model_url_template: "https://github.com/ultralytics/assets/releases/download/v8.4.0/{model_name}"
  dataset_dir: "datasets/video_v1/yolo_v8_fresh_holdout"
  data_yaml: "datasets/video_v1/yolo_v8_fresh_holdout/data.yaml"
  class_names:
    - "yoyo"
  train_split: 0.8
  seed: 42
  epochs: 100
  imgsz: 640
  batch: 8
  workers: 0
  device: ""
  project: "runs/yolo"
  run_name: "yoyo_video_candidate"
  exist_ok: false

string_segmentation:
  model_name: "yolo11n-seg.pt"
  models_dir: "models"
  dataset_dir: "datasets/video_v1/string_seg_v17_reviewed_expansion"
  annotations_dir: "datasets/video_v1/annotations"
  project: "runs/yolo"
  run_name: "yoyo_string_candidate"
  epochs: 100
  imgsz: 960
  batch: 4
  workers: 0
  device: ""
  # Width of the reviewed centerline converted to a segmentation region.
  line_width_px: 8
  # Preserve thin 4K string masks and avoid aggressive geometry on the small dataset.
  mask_ratio: 1
  translate: 0.03
  scale: 0.15
  mosaic: 0.0

semantic_string:
  # Single-class semantic baseline for thin strings. It consumes only the
  # review-gated string_seg split and is versioned separately from YOLO runs.
  dataset_dir: "datasets/video_v1/string_seg_v17_reviewed_expansion"
  project: "runs/semantic"
  run_name: "yoyo_string_semantic_candidate"
  epochs: 40
  input_width: 960
  input_height: 544
  batch: 2
  workers: 0
  learning_rate: 0.001
  base_channels: 16
  min_mask_width_px: 2
  seed: 42
  device: "cuda"

tracking:
  weights_path: "runs/yolo/yoyo_video_v8_fresh_holdout/weights/best.pt"
  output_dir: "tracked_videos"
  confidence: 0.25
  iou: 0.7
  imgsz: 640
  device: ""
  trace_length: 30
  line_thickness: 2
  text_scale: 0.6
  # Keep model inference and metadata at source resolution while limiting the
  # annotated preview video to a practical review size. Set to 0 for source.
  visualization_max_width: 1920
  pose_weights_path: "models/yolo11n-pose.pt"
  enable_pose: true
  auto_download_pose: false
  # Semantic v17 is trained from random initialization with a source-isolated
  # fresh holdout. Predictions remain review-only and never become label truth.
  string_weights_path: "runs/semantic/yoyo_string_semantic_v17_reviewed_expansion_hn005/weights/best.pt"
  enable_string_model: true
  string_confidence: 0.20
  # Val-selected 2x inference preserves thin 4K string pixels. The tracker
  # scales component-area filtering with it to avoid admitting tiny noise.
  string_inference_scale: 2.0
  # Run the expensive semantic model at this cadence and use checked optical
  # flow between observations. Set to 0 to infer on every video frame.
  string_inference_fps: 10.0
  # Temporal string tracking is review-only: stop propagation after a short
  # gap and reject optical-flow drift with forward/backward consistency.
  string_max_propagation_frames: 12
  string_flow_fb_max_error: 4.0
  string_fusion_distance_px: 48.0
  # Optional relation metadata; unknown does not force a hand/yoyo connection.
  # Current videos are 1A. Change to unknown/4A when detached-string footage
  # is being reviewed; the tracker never treats this as training truth.
  string_attachment_class: "hand_and_yoyo_attached"
  export_json: true
  export_clips: true
  # Speed is already measured in px/s; do not multiply this threshold by FPS.
  activity_speed_diagonal_per_s: 0.08
  padding_seconds: 0.4
  min_segment_seconds: 0.5
  max_gap_seconds: 0.4
  max_segment_seconds: 180.0
