dataset:
  image_input_dir: "dataset/Positive_Sample/1A"
  # Current videos are exclusively 1A. Future groups remain schema-only.
  current_action_group: "1A"
  annotation_output_dir: "annotations"
  recursive: true
  keep_source_images: true
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".webp"

yolo:
  model_name: "yolo11n.pt"
  models_dir: "models"
  # Used by cli.models.download_yolo. Override with --url if Ultralytics changes asset URLs.
  model_url_template: "https://github.com/ultralytics/assets/releases/download/v8.4.0/{model_name}"

semantic_string:
  # Single-class semantic baseline for thin strings. It consumes only the
  # review-gated string_seg split and is versioned separately from YOLO runs.
  dataset_dir: "datasets/1Ayoyo_dataset/string_segmentation"
  project: "runs/semantic"
  run_name: "yoyo_string_semantic_candidate"
  epochs: 40
  input_width: 960
  input_height: 544
  batch: 2
  workers: 0
  learning_rate: 0.001
  base_channels: 16
  min_mask_width_px: 2
  seed: 42
  device: "cuda"

tracking:
  weights_path: "runs/candidates/yoyo_unified_396ce5fa8e73_detection_yolo11s_s-current-capacity60/weights/best.pt"
  output_dir: "tracked_videos"
  confidence: 0.15
  iou: 0.7
  # YOLO11s was selected on the frozen test and four-sequence A/B. 1024 px
  # retains the small-target gain while reducing inference cost versus 1280.
  imgsz: 1024
  # The stronger YOLO11s regular prediction made TTA unnecessary: on 334
  # reviewed frames TTA added false positives and reduced F1.
  yoyo_tta_rescue: false
  yoyo_tta_trigger_confidence: 0.50
  yoyo_tta_min_confidence: 0.40
  device: ""
  trace_length: 30
  line_thickness: 2
  text_scale: 0.6
  # Keep model inference and metadata at source resolution while limiting the
  # annotated preview video to a practical review size. Set to 0 for source.
  visualization_max_width: 1920
  pose_weights_path: "models/yolo11n-pose.pt"
  enable_pose: true
  auto_download_pose: false
  # Validation-calibrated LR-ASPP model soup. Predictions remain review-only
  # and never become label truth.
  string_weights_path: "runs/candidates/yoyo_unified_0ff7d829e127_semantic_string_adaptive-lr5e6-v1/weights/primary.pt"
  # Calibrated probability ensemble. The secondary model was fine-tuned on
  # reviewed consecutive frames; thresholds are aligned before logit blending.
  string_ensemble_weights_path: "runs/candidates/yoyo_unified_0ff7d829e127_semantic_string_adaptive-lr5e6-v1/weights/secondary.pt"
  string_ensemble_alpha: 0.30
  string_ensemble_candidate_threshold: 0.50
  # Switch the primary model once a persistent weak-domain window has no
  # accepted color support, low semantic confidence, and distant geometry.
  string_adaptive_weights_path: "runs/candidates/yoyo_unified_0ff7d829e127_semantic_string_adaptive-lr5e6-v1/weights/adaptive.pt"
  string_adaptive_ensemble_alpha: 0.50
  string_adaptive_window_frames: 12
  string_adaptive_max_color_accepts: 0
  string_adaptive_max_mean_confidence: 0.82
  string_adaptive_min_mean_distance_ratio: 0.018
  enable_string_model: true
  # Semantic checkpoints use max(checkpoint validation threshold, this floor).
  string_confidence: 0.20
  # Match the input scale used for independent test evaluation.
  string_inference_scale: 1.0
  # Reacquire the multi-segment centerline on every frame. This is slower than
  # optical-flow propagation alone, but the reviewed sequence showed a large
  # geometry-recall gain with no material yoyo localization change.
  string_inference_fps: 0.0
  # Add a color/Hough centerline only when the semantic probability map also
  # supports it. This recovers weak, fragmented string pixels without allowing
  # unrelated saturated stage lines into the final geometry.
  string_color_probability_augment: true
  string_color_probability_min_mean: 0.40
  string_color_probability_min_fraction: 0.50
  # Temporal string tracking is review-only: stop propagation after a short
  # gap and reject optical-flow drift with forward/backward consistency.
  string_max_propagation_frames: 12
  string_flow_fb_max_error: 4.0
  # Legacy key name: now used as the observation-vs-flow consistency limit;
  # fresh semantic geometry is not averaged with optical flow.
  string_fusion_distance_px: 48.0
  # Competition division metadata; it does not force a hand/yoyo connection.
  # Consecutive annotations contain multiple visible centerline components and
  # do not assert that every component touches the yoyo or a visible wrist.
  # Keep component selection open; division is metadata, not a hard
  # geometry gate.
  yoyo_division: "1A"
  # Coarse three-way orientation classifier. This is not a named-trick model.
  orientation_weights_path: "runs/candidates/yoyo_unified_582cde69ebb8_orientation_roi_d88241f08b82_best_nyyc36-warm-freeze10-lr1e4-v1/weights/best.pt"
  enable_orientation_model: true
  orientation_imgsz: 320
  orientation_inference_fps: 5.0
  export_json: true
